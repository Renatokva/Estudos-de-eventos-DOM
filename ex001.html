<body>
    
    <script>
        let nome = prompt("Qual é o seu nome?");
        let idade = parseInt(prompt("Qual é a sua idade?"));
        let anoNascimento = new Date().getFullYear() - idade;
        document.write(`Olá,<strong> ${nome}</strong>! Você tem <strong>${idade}</strong> anos. Seu nome tem <strong>${nome.length}</strong> letras e você nasceu em <strong>${anoNascimento}</strong>.`);
    </script>
